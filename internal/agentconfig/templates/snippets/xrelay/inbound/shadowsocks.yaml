# shadowsocks inbound：传统单用户写法，适合简单公开节点。
# SS2022 建议使用 users 多用户写法，并确保 password 为合法 base64 PSK。
- name: shadowsocks
  protocol: shadowsocks
  listen: 0.0.0.0
  port: 24101
  method: aes-256-gcm
  password: change-me-ss-password
  udp: true
  user: user1
  remark: example shadowsocks
  region: US
  sub: true
