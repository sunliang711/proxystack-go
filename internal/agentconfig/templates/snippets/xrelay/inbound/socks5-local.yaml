# 默认 inter-stack socks5 inbound：只监听本机，供本机 Clash 或其他 stack 引用。
# 若改名或删除，需要同步修改引用方 clash.upstreams[].ref。
- name: relay
  protocol: socks5
  listen: 127.0.0.1
  port: {{ .RelayPort }}
  udp: true
  auth:
    type: noauth
  user: user1
  remark: example local socks
  # 【按需改】订阅展示名模板；支持 .stack/.protocol/.port/.user/.remark。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
  # region: US
  sub: false
