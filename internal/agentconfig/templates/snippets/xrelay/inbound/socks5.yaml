# socks5 inbound：公开发布时必须使用 password 认证。
# listen 为 0.0.0.0 时请同步确认防火墙和密码强度。
- name: relay
  protocol: socks5
  listen: 0.0.0.0
  port: {{ .RelayPort }}
  udp: true
  auth:
    type: password
    username: {{ .RelayUsername }}
    password: change-me-relay-password
  user: user1
  remark: {{ .RelayRemark }}
  # 【按需改】订阅展示名模板；支持 .stack/.protocol/.port/.user/.remark。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
  # region: US
  sub: true
