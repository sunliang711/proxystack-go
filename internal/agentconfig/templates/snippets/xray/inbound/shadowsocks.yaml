# shadowsocks inbound：用户密码来自 config.yaml users，server password 仍配置在 inbound。
# SS2022 使用 user_refs 时仍需确保 server/user password 为合法 base64 PSK。
- name: shadowsocks
  protocol: shadowsocks
  listen: 0.0.0.0
  port: 24101
  method: aes-256-gcm
  password: change-me-ss-server-password
  udp: true
  # 【按需改】订阅展示名模板；支持 .stack/.inbound/.protocol/.port/.user/.profile/.remark。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .inbound {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
  region: US
  sub: true
  user_refs:
    - user: user1
      profile: default
      remark: {{ .StackName }} shadowsocks
