name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a semantic release tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        run: |
          set -euo pipefail

          mkdir -p dist
          release_version="${GITHUB_REF_NAME}"
          build_commit="$(git rev-parse --short HEAD)"
          build_datetime="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          version_ldflags="-s -w -X github.com/eagle/proxystack-go/internal/version.Version=${release_version} -X github.com/eagle/proxystack-go/internal/version.Commit=${build_commit} -X github.com/eagle/proxystack-go/internal/version.BuildDateTime=${build_datetime}"
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              asset_os="${goos}"
              if [[ "${goos}" == "darwin" ]]; then
                asset_os="macos"
              fi
              work_dir="dist/proxystack-go_${release_version}_${asset_os}_${goarch}"
              archive="proxystack-go_${release_version}_${asset_os}_${goarch}.tar.gz"
              latest_archive="proxystack-go_${asset_os}_${goarch}.tar.gz"
              mkdir -p "${work_dir}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="${version_ldflags}" -o "${work_dir}/psctl" ./cmd/ps-agent
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="${version_ldflags}" -o "${work_dir}/pssub" ./cmd/ps-sub
              tar -C "${work_dir}" -czf "dist/${archive}" psctl pssub
              cp "dist/${archive}" "dist/${latest_archive}"
            done
          done
          (cd dist && sha256sum proxystack-go_*.tar.gz > SHA256SUMS)

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/proxystack-go_*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
