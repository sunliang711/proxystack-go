services:
  proxystack-sub:
    build:
      context: .
      dockerfile: Dockerfile.sub
    image: proxystack-sub:latest
    container_name: proxystack-sub
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - /opt/proxystack-sub:/data
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    command:
      - pssub
      - --base-dir
      - /data
      - serve
