mode: Rule
log-level: info
ipv6: true
allow-lan: false
listeners:
  - name: local
    type: socks
    listen: 127.0.0.1
    port: 17092
  - name: local-http
    type: http
    listen: 127.0.0.1
    port: 18092
external-controller: 127.0.0.1:19092
secret: demo-usa2-clash-api-secret
proxies:
  - name: server-b
    type: shadowsocks
    server: server-b.example.com
    port: 8388
    cipher: aes-256-gcm
    password: demo-server-b-password
proxy-groups:
  - name: AllProxy
    type: select
    proxies:
      - server-b
      - DIRECT
rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN,localhost,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - MATCH,AllProxy
