# vmess raw inbound：对外提供普通 TCP VMess 节点。
# 部署前必须替换 uuid；server 不填时使用全局 external_host。
- name: vmess
  protocol: vmess
  listen: 0.0.0.0
  port: 24100
  udp: true
  # server: edge.example.com
  # region: US
  network: raw
  # 【按需改】订阅展示名模板；多用户未配置 users[].display_template 时继承这里。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .user {{ "}}" }}'
  sub: true
  users:
    - user: user1
      uuid: 11111111-1111-4111-8111-111111111111
      email:
      remark: example vmess
      # 【按需改】单个用户的订阅展示名模板；配置后覆盖 inbound 级 display_template。
      # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .user {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
