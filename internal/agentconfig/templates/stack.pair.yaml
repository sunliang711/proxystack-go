# pair 模板，也是 add 默认模板
# 使用方式：
#   psctl add <name> --template pair
# 快速定位：
# - 搜索【必改】：部署前必须替换的 server、uuid、secret 等占位值。
# - 搜索【按需改】：端口、监听地址、user、remark、sub 等常见部署参数。
# - 搜索【一般不改】：默认结构配置，除非明确调整生成逻辑。
# - 搜索【被引用】：其他 stack 会通过 ref 引用的名称，改名需同步修改引用方。

# 【按需改】stack 名称；add 时会被替换为用户输入的实例名。
name: example
# 【一般不改】是否启用该 stack；false 时不会生成或管理对应服务。
enabled: true
# 【一般不改】stack 角色标记；支持全集：edge、auto；edge 表示普通边缘代理实例。
role: edge
# 【按需改】自定义标签列表；可用于分组、筛选或后续运维标记。
labels: []

# Xray/xrelay 侧配置，用于生成入站代理和转发链路。
xrelay:
  # 【一般不改】是否为该 stack 启用 xrelay 服务。
  enabled: true
  # 【按需改】stack 级 Xray 日志级别；不填继承 defaults.xrelay.loglevel。支持全集：debug、info、warning、error、none。
  # loglevel: warning

{{ stackSnippet "xrelay.api.default" 2 }}

{{ stackSnippet "xrelay.stats.enabled" 2 }}

{{ stackSnippet "xrelay.policy.enabled" 2 }}

  # xrelay 入站列表，会生成对应 Xray inbound。
  inbounds:
{{ stackSnippet "xrelay.inbound.socks5-local" 4 }}

{{ stackSnippet "xrelay.inbound.vmess-raw" 4 }}

  # 【一般不改】xrelay 出站配置，决定入站流量转发到哪里。
  # 下方方案只保留一种：默认方案 A 走本 stack 的 Clash；改用其他方案时同步删除或注释不适用字段。
{{ stackSnippet "xrelay.outbound.clash" 2 }}

# Clash/mihomo 侧配置，用于生成本地出站代理和规则。
clash:
  # 【一般不改】是否为该 stack 启用 Clash 服务。
  # 如果 xrelay.outbound.type 不使用 clash，可以设为 false，不生成或管理 Clash 服务；但当前 stack 模型仍要求保留合法 clash 配置段。
  enabled: true
  # 【按需改】Clash 运行模式；支持全集：Rule、Global、Direct；Rule 表示按规则分流。
  mode: Rule
  # 【按需改】stack 级 mihomo/clash 日志级别；不填继承 defaults.clash.loglevel。支持全集：debug、info、warning、error、silent。
  # loglevel: info

{{ stackSnippet "clash.controller.default" 2 }}

  # Clash 本地监听器配置。
  listeners:
    # socks 监听器列表，供本机或 xrelay 连接。
    socks:
{{ stackSnippet "clash.listener.socks" 6 }}
    # HTTP 监听器列表，供本机 HTTP 代理客户端连接。
    http:
{{ stackSnippet "clash.listener.http" 6 }}

  # Clash 上游代理列表。
  upstreams:
{{ stackSnippet "clash.upstream.vmess-websocket" 4 }}

  # Clash 代理组列表。
  groups:
{{ stackSnippet "clash.group.select" 4 }}

  # Clash 规则集选择。
  rules:
    # 内置规则 profile 名称；支持全集：default；default 表示使用默认分流规则。
    profile: default
