# vmess raw inbound：对外提供普通 TCP VMess 节点。
# UUID 来自 config.yaml users；server 不填时使用全局 external_host。
- name: vmess
  protocol: vmess
  listen: 0.0.0.0
  port: 24100
  udp: true
  # server: edge.example.com
  # region: US
  network: raw
  # 【按需改】订阅展示名模板；user_refs 未配置 display_template 时继承这里。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .inbound {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .user {{ "}}" }}'
  sub: true
  user_refs:
    - user: user1
      profile: default
      remark: {{ .StackName }} vmess
      # 【按需改】单个引用的订阅展示名模板；配置后覆盖用户档案和 inbound 级 display_template。
      # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .user {{ "}}" }} {{ "{{" }} .profile {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
