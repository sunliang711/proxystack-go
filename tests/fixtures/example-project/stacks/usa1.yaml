name: usa1
enabled: true
role: edge
labels: [usa]

xray:
  enabled: true
  api:
    enabled: true
    listen: 127.0.0.1:10091
  stats:
    enabled: true
  policy:
    enabled: true
  outbound:
    type: clash
    ref: usa1.clash.socks
  inbounds:
    - name: relay
      protocol: socks5
      listen: 0.0.0.0
      port: 24001
      udp: true
      auth:
        type: password
        username: usa1
        password: demo-usa1-relay-password
      remark: usa1 relay socks
      sub: true
      user_refs: [alice]
    - name: vmess
      protocol: vmess
      listen: 0.0.0.0
      port: 24101
      udp: true
      network: raw
      remark: usa1 vmess
      sub: true
      user_refs: [alice]

clash:
  enabled: true
  mode: Rule
  controller:
    listen: 127.0.0.1:19091
    secret: demo-usa1-clash-api-secret
  listeners:
    socks:
      - name: local
        listen: 127.0.0.1
        port: 17091
    http:
      - name: local
        listen: 127.0.0.1
        port: 18091
  upstreams:
    - name: server-a
      type: raw
      config:
        type: vmess
        server: server-a.example.com
        port: 443
        uuid: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        network: ws
        tls: true
        ws_opts:
          path: /vmess
  groups:
    - name: AllProxy
      type: select
      proxies: [server-a, DIRECT]
  rules:
    profile: default
