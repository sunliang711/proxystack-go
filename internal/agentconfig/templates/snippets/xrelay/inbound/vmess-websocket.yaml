# vmess WebSocket inbound：使用 ws 传输的 VMess 节点。
# ws_opts 会生成到 Xray wsSettings，并同步进入订阅的 ws-opts。
- name: vmess-ws
  protocol: vmess
  listen: 0.0.0.0
  port: 24102
  udp: true
  # server: edge.example.com
  # region: US
  network: ws
  ws_opts:
    path: /vmess
    headers:
      Host: edge.example.com
  # 【按需改】订阅展示名模板；多用户未配置 users[].display_template 时继承这里。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .user {{ "}}" }}'
  sub: true
  users:
    - user: user1
      uuid: 11111111-1111-4111-8111-111111111111
      email:
      remark: example vmess websocket
      # 【按需改】单个用户的订阅展示名模板；配置后覆盖 inbound 级 display_template。
      # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .user {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
