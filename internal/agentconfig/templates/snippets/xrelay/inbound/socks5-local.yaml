# 默认 inter-stack socks5 inbound：只监听本机，供本机 Clash 或其他 stack 引用。
# 若改名或删除，需要同步修改引用方 clash.upstreams[].ref。
- name: relay
  protocol: socks5
  listen: 127.0.0.1
  port: {{ .RelayPort }}
  udp: true
  # auth 是 socks5 的实际连接认证；不会从 config.yaml users 自动读取。
  # user_refs 只决定订阅归属和节点名。
  auth:
    type: noauth
  # 【按需改】订阅展示名模板；支持 .stack/.inbound/.protocol/.port/.user/.profile/.remark。
  # display_template: '{{ "{{" }} .stack {{ "}}" }} {{ "{{" }} .inbound {{ "}}" }} {{ "{{" }} .protocol {{ "}}" }} {{ "{{" }} .remark {{ "}}" }}'
  # region: US
  sub: false
  user_refs:
    - user: user1
      profile: default
      remark: {{ .StackName }} local socks
