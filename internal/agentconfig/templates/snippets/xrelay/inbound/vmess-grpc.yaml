# vmess gRPC inbound：使用 grpc 传输的 VMess 节点。
# grpc_opts 会生成到 Xray grpcSettings，并同步进入订阅的 grpc-opts。
- name: vmess-grpc
  protocol: vmess
  listen: 0.0.0.0
  port: 24103
  udp: true
  # server: edge.example.com
  # region: US
  network: grpc
  grpc_opts:
    grpc_service_name: vmess
  sub: true
  users:
    - user: user1
      uuid: 11111111-1111-4111-8111-111111111111
      email:
      remark: example vmess grpc
